name: Backfill BVT Replay history

on:
  workflow_dispatch:
    inputs:
      trading_days:
        description: Number of recent trading days to rebuild
        required: true
        default: "90"
      missing_dates:
        description: Space-separated YYYY-MM-DD trading dates to recover (overrides trading_days)
        required: false
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build historical Replay snapshots
        env:
          TRADING_DAYS: ${{ inputs.trading_days }}
          MISSING_DATES: ${{ inputs.missing_dates }}
        run: |
          if [[ -n "$MISSING_DATES" ]]; then
            read -r -a dates <<< "$MISSING_DATES"
            python scripts/backfill_replay_snapshots.py --missing-dates "${dates[@]}"
          else
            python scripts/backfill_replay_snapshots.py --days "$TRADING_DAYS"
          fi
      - name: Rebuild Replay manifest from stored snapshots
        run: python scripts/build_replay_snapshot.py --manifest-only
      - name: Rebuild weekly market summary
        run: python scripts/build_weekly_summary.py
      - name: Test Replay data pipeline
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Commit and push snapshots
        run: |
          git config user.name "bmo-moneyflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add replay_data weekly_summary.json
          git commit -m "data: backfill BVT Replay history" || echo "No changes"
          git push
