name: Update market data

on:
  schedule:
    # 월~금 23:30 UTC = 한국시간 화~토 오전 8:30
    # 미국 정규장 마감 후 실행하므로 금요일 장 데이터는 토요일 아침에 갱신됩니다.
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python fetch_data.py

      - name: Build full US-listed stock search directory
        run: python scripts/build_stock_directory.py

      - name: Fetch earnings calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_earnings.py

      - name: Fetch company news and official websites
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_news.py

      - name: Add Korean news summaries
        run: python scripts/enrich_news_summaries.py

      - name: Store BVT Replay snapshot
        run: python scripts/build_replay_snapshot.py

      - name: Rebuild Replay manifest from stored snapshots
        run: python scripts/build_replay_snapshot.py --manifest-only

      - name: Build weekly market summary
        run: python scripts/build_weekly_summary.py

      - name: Test Replay data pipeline
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Commit & push
        run: |
          git config user.name "bmo-moneyflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json sector_map.json history.json earnings.json news.json replay_data weekly_summary.json stock_directory.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "data: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after syncing main."
            sleep $((attempt * 5))
          done

          echo "Failed to push generated data after 3 attempts."
          exit 1
