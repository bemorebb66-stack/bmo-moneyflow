name: Refresh pre-market events and news

on:
  schedule:
    # 월~금 13:00 UTC = 한국시간 월~금 오후 10:00
    # 장 시작 전 새 실적 일정·발표 결과·기업 뉴스를 갱신합니다.
    - cron: "0 13 * * 1-5"
  workflow_run:
    # 오전 거래 갱신의 성공 여부와 무관하게 발표 완료 실적을 다시 확인합니다.
    workflows: ["Update market data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-pre-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued manual run must start from the latest data commit, not the
          # older dispatch SHA, or earnings.json/news.json can conflict on push.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh scheduled dates and reported results
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_earnings.py

      - name: Refresh company news
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_news.py

      - name: Add Korean news summaries
        run: python scripts/enrich_news_summaries.py

      - name: Test event and news pipelines
        run: |
          python -m unittest discover -s tests -p "test_earnings_pipeline.py"
          python -m unittest discover -s tests -p "test_news_pipeline.py"
          python scripts/test_news_summaries.py

      - name: Commit and push
        run: |
          git config user.name "bmo-moneyflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add earnings.json news.json
          if git diff --cached --quiet; then
            echo "No pre-market event or news changes"
            exit 0
          fi

          git commit -m "data: refresh pre-market events and news"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
